<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Inventory System - Dashboard</title>

    <link rel="stylesheet" href="CSS/style.css">
</head>

<body>

<div class="app-layout">

    <!-- Sidebar -->
    <aside class="sidebar">
        <div class="sidebar-brand">
            <img src="image/eGAZ logo.jpeg" alt="eGAZ Logo">
            <span>Inventory System</span>
        </div>

        <nav id="sidebarMenu"></nav>
    </aside>

    <!-- Main Content -->
    <main class="main-content">

        <!-- Top Bar -->
        <header class="topbar">
            <div>
                <h2>Dashboard</h2>
            </div>

            <div id="userInfo" class="user-info"></div>
        </header>

        <!-- Dashboard Content -->
        <section class="page-content">

            <div class="welcome-box">
                <h1>Welcome to Inventory System</h1>
                <p>
                    Manage items, rooms, stock allocation and inventory reports
                    from one system.
                </p>
            </div>

            <!-- Statistics Cards -->
            <div class="dashboard-cards">

                <div class="stat-card">
<div>
                        <span>Total Items</span>
                        <h2 id="itemCount">0</h2>
                    </div>
                </div>

                <div class="stat-card">
<div>
                        <span>Total Rooms</span>
                        <h2 id="roomCount">0</h2>
                    </div>
                </div>

                <div class="stat-card">
<div>
                        <span>Remaining Stock</span>
                        <h2 id="stockCount">0</h2>
                    </div>
                </div>

                <div class="stat-card">
<div>
                        <span>Allocated Stock</span>
                        <h2 id="allocatedCount">0</h2>
                    </div>
                </div>

            </div>

            <!-- Quick Actions -->
            <div class="content-card">
                <div class="card-header">
                    <h3>Quick Actions</h3>
                </div>

                <div id="quickActions" class="quick-actions"></div>
            </div>

            <!-- System Progress -->
            <div class="content-card">
                <div class="card-header">
                    <h3>System Overview</h3>
                </div>

                <div id="progressBox"></div>
            </div>

        </section>

    </main>

</div>

<script src="JS/api.js"></script>
<script src="JS/auth.js"></script>
<script src="JS/nav.js"></script>
<script src="JS/dashboard.js"></script>

</body>
</html>
