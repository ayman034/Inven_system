<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">

    <title>Inventory System - Items</title>

    <link rel="stylesheet" href="CSS/style.css">
</head>

<body>

<div class="app-layout">

    <!-- Sidebar -->
    <aside class="sidebar">

        <div class="sidebar-brand">
            <img src="image/eGAZ logo.jpeg" alt="eGAZ Logo">
            <span>Inventory System</span>
        </div>

        <nav id="sidebarMenu"></nav>

    </aside>


    <!-- Main Content -->
    <main class="main-content">

        <!-- Topbar -->
        <header class="topbar">

            <div>
                <h2>Items</h2>
            </div>

            <div id="userInfo" class="user-info"></div>

        </header>


        <!-- Page Content -->
        <section class="page-content">

            <!-- Add Item -->
            <div class="content-card" id="itemFormContainer">

                <div class="card-header">
                    <h3>Add New Item</h3>
                </div>

                <form id="itemForm">

                    <div class="form-row">

                        <div class="form-group">
                            <label for="itemName">
                                Item Name
                            </label>

                            <input
                                type="text"
                                id="itemName"
                                placeholder="Enter item name"
                                required
                            >
                        </div>


                        <div class="form-group">
                            <label for="category">
                                Category
                            </label>

                            <input
                                type="text"
                                id="category"
                                placeholder="Enter category"
                                required
                            >
                        </div>


                        <div class="form-group">
                            <label for="quantity">
                                Quantity
                            </label>

                            <input
                                type="number"
                                id="quantity"
                                min="0"
                                placeholder="Enter quantity"
                                required
                            >
                        </div>

                    </div>

                    <button
                        type="submit"
                        class="btn btn-primary"
                    >
                        Add Item
                    </button>

                </form>

            </div>


            <!-- Search -->
            <div class="content-card">

                <div class="card-header">
                    <h3>Registered Items</h3>
                </div>

                <div class="search-box">

                    <input
                        type="text"
                        id="searchItem"
                        placeholder="Search item..."
                    >

                </div>


                <!-- Items Table -->
                <div class="table-responsive">

                    <table>

                        <thead>

                            <tr>
                                <th>ID</th>
                                <th>Item Name</th>
                                <th>Category</th>
                                <th>Total Quantity</th>
                                <th>Allocated</th>
                                <th>Remaining</th>
                                <th>Action</th>
                            </tr>

                        </thead>

                        <tbody id="itemTableBody"></tbody>

                    </table>

                </div>

            </div>


            <!-- Edit Item -->
            <div
                class="content-card"
                id="editItemContainer"
                style="display:none;"
            >

                <div class="card-header">
                    <h3>Edit Item</h3>
                </div>

                <form id="editItemForm">

                    <input
                        type="hidden"
                        id="editItemId"
                    >


                    <div class="form-row">

                        <div class="form-group">

                            <label for="editItemName">
                                Item Name
                            </label>

                            <input
                                type="text"
                                id="editItemName"
                                required
                            >

                        </div>


                        <div class="form-group">

                            <label for="editCategory">
                                Category
                            </label>

                            <input
                                type="text"
                                id="editCategory"
                                required
                            >

                        </div>


                        <div class="form-group">

                            <label for="editQuantity">
                                Total Quantity
                            </label>

                            <input
                                type="number"
                                id="editQuantity"
                                min="0"
                                required
                            >

                        </div>

                    </div>


                    <button
                        type="submit"
                        class="btn btn-primary"
                    >
                        Update Item
                    </button>

                    <button
                        type="button"
                        id="cancelEditBtn"
                        class="btn btn-secondary"
                    >
                        Cancel
                    </button>

                </form>

            </div>

        </section>

    </main>

</div>


<script src="JS/api.js"></script>
<script src="JS/auth.js"></script>
<script src="JS/nav.js"></script>

<script>
    protectSection("items");
</script>

<script src="JS/item.js"></script>

</body>
</html>
