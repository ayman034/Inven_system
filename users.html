<!DOCTYPE html>
<html lang="en">
<head>

    <meta charset="UTF-8">

    <meta
        name="viewport"
        content="width=device-width, initial-scale=1.0"
    >

    <title>Inventory System - Users</title>

    <link
        rel="stylesheet"
        href="CSS/style.css"
    >

</head>

<body>

<div class="app-layout">

    <aside class="sidebar">

        <div class="sidebar-brand">

            <img
                src="image/eGAZ logo.jpeg"
                alt="eGAZ Logo"
            >

            <span>Inventory System</span>

        </div>

        <nav id="sidebarMenu"></nav>

    </aside>


    <main class="main-content">

        <header class="topbar">

            <div>
                <h2>User Management</h2>
            </div>

            <div
                id="userInfo"
                class="user-info"
            ></div>

        </header>


        <section class="page-content">


            <!-- Add User -->
            <div class="content-card">

                <div class="card-header">

                    <h3>Add New User</h3>

                </div>


                <form id="userForm">

                    <div class="form-row">


                        <div class="form-group">

                            <label for="fullName">
                                Full Name
                            </label>

                            <input
                                type="text"
                                id="fullName"
                                placeholder="Enter full name"
                                required
                            >

                        </div>


                        <div class="form-group">

                            <label for="userName">
                                Username
                            </label>

                            <input
                                type="text"
                                id="userName"
                                placeholder="Enter username"
                                required
                            >

                        </div>


                        <div class="form-group">

                            <label for="userPassword">
                                Password
                            </label>

                            <input
                                type="password"
                                id="userPassword"
                                placeholder="Enter password"
                                required
                            >

                        </div>


                        <div class="form-group">

                            <label for="role">
                                Role
                            </label>

                            <select id="role" required>

                                <option value="">
                                    Select Role
                                </option>

                                <option value="ADMIN">
                                    ADMIN
                                </option>

                                <option value="STOREKEEPER">
                                    STOREKEEPER
                                </option>

                                <option value="SUPERVISOR">
                                    SUPERVISOR
                                </option>

                            </select>

                        </div>

                    </div>


                    <button
                        type="submit"
                        class="btn btn-primary"
                    >
                        Create User
                    </button>

                </form>

            </div>


            <!-- Users -->
            <div class="content-card">

                <div class="card-header">

                    <h3>System Users</h3>

                </div>


                <div class="table-responsive">

                    <table>

                        <thead>

                            <tr>

                                <th>ID</th>

                                <th>Full Name</th>

                                <th>Username</th>

                                <th>Role</th>

                                <th>Status</th>

                                <th>Action</th>

                            </tr>

                        </thead>


                        <tbody id="userTableBody"></tbody>

                    </table>

                </div>

            </div>

        </section>

    </main>

</div>


<script src="JS/api.js"></script>
<script src="JS/auth.js"></script>
<script src="JS/nav.js"></script>

<script>
    checkRole(["ADMIN"]);
</script>

<script src="JS/users.js"></script>

</body>
</html>
